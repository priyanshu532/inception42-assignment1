{{- range $name, $service := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
spec:
  replicas: {{ $.Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $name }}
          image: {{ $service.image | quote }}
          imagePullPolicy: Never
{{ if eq $name "gateway" }}
          env:
            - name: CATALOG_URL
              value: "http://catalog"
            - name: ASSISTANT_URL
              value: "http://assistant"
{{ else if eq $name "assistant" }}
          env:
            - name: LLM_URL
              value: "http://llm:8000"
{{ end }}
          ports:
            - containerPort: {{ $service.port }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: {{ $service.memory }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ $service.port }}
            periodSeconds: 5
{{ if eq $name "catalog" }}
            initialDelaySeconds: 3
{{ end }}
{{ if or (eq $name "catalog") (eq $name "gateway") }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ $service.port }}
            periodSeconds: 10
{{ if eq $name "catalog" }}
            initialDelaySeconds: 10
{{ end }}
{{ end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  selector:
    app: {{ $name }}
  ports:
    - port: {{ $service.servicePort }}
      targetPort: {{ $service.port }}
{{- end }}
